---
# Shared install defaults (fallback; operator catalog: group_vars/all/atlas-kafka.yml)
kafka_controller_hosts: kafka_controllers
kafka_broker_hosts: kafka_brokers

kafka_version: "4.3.1"
kafka_user: kafka
kafka_group: kafka
kafka_install_root: /opt/kafka
kafka_current_link: "{{ kafka_install_root }}/current"
kafka_conf_dir: /etc/kafka
kafka_data_dir: /var/lib/kafka
kafka_log_dir: /var/log/kafka
kafka_broker_port: 9092
kafka_controller_port: 9093
kafka_heap_opts: "-Xms1G -Xmx1G"
kafka_jvm_performance_opts: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20"
kafka_service_name: kafka
kafka_cluster_id_marker: "{{ kafka_data_dir }}/cluster.id"
kafka_cluster_id_workspace_marker: >-
  {{
    lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_ROOT')
    | default(cluster_workspace_root | default('', true), true)
  }}/.cache/atlas-kafka/cluster.id

kafka_controller_log_subdir: kraft-controller-logs
kafka_controller_metadata_log_dir: "{{ kafka_data_dir }}/{{ kafka_controller_log_subdir }}"
kafka_controller_properties: "{{ kafka_conf_dir }}/controller.properties"
kafka_controller_service_retries: 30
kafka_controller_service_delay: 2
