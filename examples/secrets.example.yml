# Prefer editing group_vars/all/atlas-kafka.secrets.yml (Vault-friendly canonical overlay).
# Standalone EXTRA_VARS_FILE alternative:
#   cp examples/secrets.example.yml /path/to/secrets.yml   # keep outside git if plaintext
#   # fill values, optionally: ansible-vault encrypt /path/to/secrets.yml
#   EXTRA_VARS_FILE=/path/to/secrets.yml ./run.sh
#

# Example overlay for ./run.sh (optional for lab plaintext).
# Usage:
#   cp examples/secrets.example.yml /path/to/kafka-overlay.yml   # keep outside git
#   # fill values, optionally: ansible-vault encrypt /path/to/kafka-overlay.yml
#   EXTRA_VARS_FILE=/path/to/kafka-overlay.yml ./run.sh
#
# These keys override group_vars/all/atlas-kafka.yml. Do not commit real secrets.
# Lab v1 defaults to kafka_security_mode: plaintext (no AUTH passwords).

# Optional download / identity overrides
# kafka_download_mirror_url: "https://mirror.example.com/kafka"
# cluster_domain: kafka.example.com

# When you move beyond plaintext, keep TLS/SASL material out of git, e.g.:
# kafka_security_mode: sasl_ssl
# kafka_sasl_jaas_config: "CHANGEME"
